# GUTS: direct k-way km1 partitioning with initial partitioning only
# (no coarsening, no refinement); Boundary Refinement (Sec. 4.3) does the local improvement.
# Custom settings, not an upstream preset. Option names follow the KaHyPar configs:
# https://github.com/kahypar/kahypar/tree/master/config
mode=direct
objective=km1
c-type=do_nothing
r-type=do_nothing
i-technique=flat
i-mode=recursive
i-algo=pool
i-r-type=do_nothing
i-bp-algorithm=worst_fit
i-runs=20
quiet=1
